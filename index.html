<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141415">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym — журнал тренувань</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0f0f10;--bg:#141415;--card:#19191b;--raised:#232325;
  --line:rgba(237,237,237,.08);--line2:rgba(237,237,237,.14);
  --text:#ededed;--text2:#a1a1a6;--muted:#85858b;
  --acc:#f0913a;--acc-ink:#141415;--pos:#4cc38a;--neg:#e5484d;
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --disp:"Bricolage Grotesque","Geist",-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 15px/22px var(--sans);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
body.has-timer{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(20,20,21,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:16px;line-height:24px;font-weight:500;margin:0}
.meta{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--muted);font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding:16px}
svg.i{width:18px;height:18px;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--deep);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;border-radius:0;min-height:56px;color:var(--muted);padding:8px 0;font-size:12px;line-height:16px;font-weight:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button svg.i{width:20px;height:20px}
nav button.on{color:var(--text)}
nav button.on svg.i{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{margin:0;font-size:16px;line-height:24px;font-weight:500}
.sub{color:var(--text2);font-size:13px;line-height:20px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.top{align-items:flex-start;flex-wrap:nowrap}
.tight{gap:4px;flex-wrap:nowrap}
button{font-family:inherit;background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:36px;font-size:14px;line-height:20px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background-color .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease)}
button:hover{background:#2a2a2d}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid rgba(240,145,58,.7);outline-offset:1px}
button.pri{background:var(--text);color:var(--bg);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
button.pri:hover{background:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--text2)}
button.ghost:hover{background:var(--raised);color:var(--text)}
button.sm{min-height:32px;padding:4px 12px;font-size:13px}
button.wide{width:100%;min-height:48px;font-size:16px;margin-bottom:8px}
button.icon{width:36px;height:36px;min-height:36px;padding:0;background:transparent;border-color:transparent;color:var(--muted)}
button.icon:hover{background:var(--raised);color:var(--text)}
button.icon.del:hover{color:var(--neg)}
button.danger{color:var(--neg);background:transparent}
input,textarea,select{font-family:inherit;background:var(--deep);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:16px;line-height:24px;width:100%;min-height:44px}
input::placeholder,textarea::placeholder{color:#5c5c61}
textarea{resize:vertical}
label{display:block;font-size:13px;line-height:20px;color:var(--text2);margin-bottom:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--deep);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.seg button{background:transparent;border-color:transparent;color:var(--text2);min-height:40px;font-size:15px;flex-direction:column;gap:0;line-height:18px}
.seg button.on{background:var(--raised);color:var(--text);border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.seg .next{font-family:var(--mono);font-size:11px;line-height:14px;color:var(--muted);font-weight:400}
.field-row{display:grid;grid-template-columns:188px 1fr;gap:12px;align-items:end;margin-top:16px}
.field-row .pad{padding-bottom:12px}
.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.code{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--muted)}
.target{font-family:var(--mono);font-size:14px;line-height:20px;color:var(--text);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:16px}
.target span{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.note{font-size:13px;line-height:20px;color:var(--text2);margin-top:4px}
.meta-line{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--muted);margin-top:4px}
.last{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:12px 0}
.last-h{font-size:12px;line-height:16px;color:var(--muted)}
.last-v{font-family:var(--mono);font-size:14px;line-height:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.last .up{font-size:13px;line-height:20px;color:var(--acc);margin-top:4px}
.last .muted{font-size:13px;line-height:20px;margin-top:4px}
.sets{display:grid;grid-template-columns:24px 1fr 1fr 1fr;gap:8px;align-items:center;margin-top:12px}
.sets .h{font-size:12px;line-height:16px;color:var(--muted);text-align:center}
.sets input{text-align:center;padding:8px 4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.k{width:24px;height:24px;border-radius:6px;border:1px solid var(--line2);font-family:var(--mono);font-size:12px;line-height:22px;text-align:center;color:var(--muted);transition:background-color .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
.k.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:500}
.set-btns{display:flex;gap:4px;margin-top:8px;margin-left:-8px}
.banner{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:12px;font-size:14px;line-height:20px}
.banner>svg.i{color:var(--acc)}
.banner>div{flex:1}
.hist{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.hist-ex{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:20px;padding:4px 0}
.hist-ex span:first-child{color:var(--text2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hist-ex .mono{text-align:right}
.note-line{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:20px;color:var(--text2);margin-top:8px}
.note-line svg.i{width:16px;height:16px;margin-top:2px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:400;font-size:12px;line-height:16px}
td.num,th.num{text-align:right}
td.num,td.d{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block;margin:12px 0 4px}
.stat-l{font-size:13px;line-height:20px;color:var(--text2)}
.stat{display:flex;align-items:baseline;gap:4px;margin-top:4px}
.fig{font-size:32px;line-height:36px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.unit{font-size:15px;color:var(--text2)}
.chg{font-family:var(--mono);font-size:12px;line-height:16px;margin-top:4px;color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.timer{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));z-index:5;background:var(--deep);border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:4px;align-items:center;justify-content:center}
.timer .t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;line-height:24px;font-weight:500;min-width:72px;text-align:center;color:var(--muted)}
.timer .t.run{color:var(--acc)}
.timer .t.end{color:var(--pos)}
.timer button{font-family:var(--mono);font-weight:400}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-6px);background:var(--raised);border:1px solid var(--line2);color:var(--text);padding:8px 16px;border-radius:8px;font-size:14px;line-height:20px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
details summary{cursor:pointer;color:var(--text2);font-size:13px;line-height:20px}
.tips{margin-top:16px;border-top:1px solid var(--line);padding-top:8px}
.tips div{padding:8px 0;font-size:13px;line-height:20px;color:var(--text2)}
.tips b{display:block;color:var(--text);font-weight:500;font-size:14px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mt12{margin-top:12px}
.datef{position:relative;display:flex;gap:8px;align-items:stretch}
.datef .dtext{flex:1;min-width:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.pickbtn{position:relative;flex:none;width:44px;min-height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--text);cursor:pointer;overflow:hidden;transition:background-color .15s var(--ease)}
.pickbtn:hover{background:#2a2a2d}
.pickbtn:focus-within{outline:2px solid rgba(240,145,58,.7);outline-offset:1px}
.pickbtn .dpick{position:absolute;inset:0;width:100%;height:100%;min-height:0;margin:0;padding:0;border:0;opacity:0;font-size:16px;cursor:pointer;-webkit-appearance:none;appearance:none;background:transparent;color:transparent}
.pickbtn .dpick::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer}
input.bad-in{border-color:var(--neg)}
header h1{display:flex;align-items:center;gap:8px}
.mark{width:22px;height:22px;flex:none}
.mk-t{fill:none;stroke:var(--line2);stroke-width:3}
.mk-a{fill:none;stroke:var(--acc);stroke-width:3;transition:stroke-dashoffset .4s var(--ease)}
.mk-h{fill:var(--acc)}
.disp{font-family:var(--disp);font-variant-numeric:tabular-nums}
.today{padding:16px 16px 20px;overflow:hidden}
.today-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.day-l{font-size:13px;line-height:20px;color:var(--text2);margin-top:12px}
.day-big{font-family:var(--disp);font-size:80px;line-height:72px;font-weight:500;letter-spacing:-.03em;margin:0 0 8px -4px}
.plate-wrap{flex:none;width:132px;text-align:center;margin:-4px -4px 0 0}
.plate{width:132px;height:132px;display:block;transform:rotate(-8deg);filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.pl-n{font-family:var(--disp);font-weight:600;font-size:15px;fill:#ededed;letter-spacing:-.01em}
.pl-u{font-family:var(--mono);font-size:8px;fill:#85858b;letter-spacing:.1em}
.plate-cap{font-family:var(--mono);font-size:11px;line-height:16px;color:var(--muted);margin-top:4px}
.plate-cap span{color:var(--text2)}
#plArc{transition:stroke-dashoffset .4s var(--ease)}
.rack{display:grid;grid-template-columns:repeat(12,1fr);margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.rk-c{display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
.rk-c i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line2)}
.rk-c.past i{border-color:var(--line)}
.rk-c.dl i{border-style:dashed}
.rk-c.cur i{border-color:rgba(240,145,58,.55)}
.rk-c i.on{border:0;background:radial-gradient(circle,var(--card) 0 2px,rgba(237,237,237,.34) 2.6px)}
.rk-c.cur i.on{background:radial-gradient(circle,var(--card) 0 2px,var(--acc) 2.6px)}
.rk-c b{font-family:var(--mono);font-size:11px;line-height:16px;font-weight:400;color:var(--muted);margin-top:4px}
.rk-c.cur b{color:var(--text)}
.rack-l{display:flex;justify-content:space-between;margin-top:8px}
.code .ok{color:var(--text)}
.rec{font-size:13px;line-height:20px;color:var(--acc);margin-top:8px}
.rec .pr{margin:0 8px 0 0}
.sum{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sum .plate{width:72px;height:72px;margin:4px 4px 0 0}
.sum-row{display:flex;gap:16px;margin-top:12px;font-size:13px;line-height:20px;color:var(--text2)}
.sum-row b{font-family:var(--mono);font-weight:500;color:var(--text);margin-right:4px;font-variant-numeric:tabular-nums}
.lad{display:grid;grid-template-columns:repeat(6,1fr);align-items:end;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.lad div{display:flex;flex-direction:column;align-items:center;text-align:center}
.lad svg{display:block;margin-bottom:8px}
.lad span{font-size:12px;line-height:16px;color:var(--text2);white-space:nowrap}
.lad .cur span{color:var(--text)}
.lad small{font-family:var(--mono);font-size:11px;line-height:16px;color:var(--muted);white-space:nowrap}
.empty svg{display:block;margin:0 auto 12px}
.empty .sub{margin-top:4px;color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.hdr-r{display:flex;align-items:center;gap:4px;min-width:0}
.hdr-r .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button.icon.on{color:var(--acc)}
/* Добавки */
.sp-day{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:8px}
.sp-day>div{text-align:center}
.sp-day h3{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
button.icon:disabled{opacity:.3;cursor:default}
button.icon:disabled:hover{background:transparent;color:var(--muted)}
.blister{margin-top:16px;padding:12px 8px 8px;border-radius:12px;background:linear-gradient(180deg,#2c2c2f,#242427);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 16px rgba(0,0,0,.25);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative}
.blister::before{content:"";position:absolute;inset:6px;border-radius:8px;border:1px dashed rgba(237,237,237,.07);pointer-events:none}
.bl{background:none;border:0;border-radius:8px;padding:0 0 4px;min-height:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text2);font-weight:400}
.bl:hover{background:rgba(255,255,255,.03)}
.bl svg{width:56px;height:56px;display:block;overflow:visible}
.bl span{font-size:12px;line-height:16px;white-space:nowrap}
.bl.taken span{color:var(--muted)}
.bl .pill,.bl .dome{transform-box:fill-box;transform-origin:center}
.bl.taken .pill,.bl.taken .dome{opacity:0}
.bl .tear{opacity:0}
.bl.taken .tear{opacity:1}
.bl.pop .pill{animation:pillOut .4s var(--ease) both}
.bl.pop .dome{animation:fadeOut .2s var(--ease) both}
.bl.pop .tear{animation:fadeIn .25s .1s var(--ease) both}
.bl.off{opacity:.45}
@keyframes pillOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-12px) scale(.8)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sp-sum{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;min-height:32px}
.sp-g{margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sp-g h4{margin:0;font-size:13px;line-height:20px;font-weight:500;color:var(--text2)}
.sp-list{padding:4px 16px}
.sp-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sp-row:last-child{border-bottom:0}
.sp-main{flex:1;min-width:0}
.sp-name{font-size:15px;line-height:22px;font-weight:500}
.sp-dose{font-family:var(--mono);font-size:13px;line-height:20px;color:var(--text);margin-top:2px}
.sp-row .note{margin-top:2px}
.sp-row .up{font-size:13px;line-height:20px;color:var(--acc);margin-top:4px}
.kc-row{display:flex;gap:4px;flex:none}
.kc{width:40px;height:40px;min-height:40px;padding:0;flex:none;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--muted);font-family:var(--mono);font-size:14px;font-weight:500;box-shadow:inset 0 -2px 0 rgba(0,0,0,.4)}
.kc:hover{background:var(--raised);color:var(--text)}
.kc.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.kc.on:hover{background:#f4a057}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px;justify-items:center}
.cal b{font-family:var(--mono);font-size:11px;line-height:16px;font-weight:400;color:var(--muted)}
.cal i{width:20px;height:20px;border-radius:50%;border:1px solid var(--line2)}
.cal i.on{border:0;background:radial-gradient(circle,var(--card) 0 2.5px,rgba(237,237,237,.34) 3px)}
.cal i.today{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--acc)}
.cal i.fut{border-color:var(--line);opacity:.4}
.bar12{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:16px}
.bar12 i{height:8px;border-radius:2px;background:var(--raised)}
.bar12 i.win{box-shadow:inset 0 0 0 1px var(--line2);background:repeating-linear-gradient(135deg,rgba(237,237,237,.12) 0 2px,transparent 2px 4px)}
.bar12 i.past{background:rgba(237,237,237,.34)}
.bar12 i.cur{background:var(--acc)}
.bar4{grid-template-columns:repeat(4,1fr)}
.warn{margin:0;padding:0 0 0 16px;font-size:13px;line-height:20px;color:var(--text2)}
.warn li{margin-top:8px}
.sum-prot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;line-height:20px;color:var(--text2)}
.sum{flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.bl.pop .pill,.bl.pop .dome,.bl.pop .tear{animation:none}}
.enter>*{animation:rise .28s var(--ease) both}
.enter>:nth-child(2){animation-delay:40ms}
.enter>:nth-child(3){animation-delay:80ms}
.enter>:nth-child(n+4){animation-delay:120ms}
@media (prefers-reduced-motion:reduce){.enter>*{animation:none}.mk-a,#plArc{transition:none}}
.dkey{width:40px;height:40px;flex:none;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center;font-family:var(--disp);font-size:20px;font-weight:500;background:var(--bg);box-shadow:inset 0 -2px 0 rgba(0,0,0,.4)}
.hist-head{display:flex;gap:12px;align-items:center;flex:1;min-width:0}
.fig{font-family:var(--disp)}

<body>
<header>
  <h1><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle class="mk-t" cx="12" cy="12" r="9"/><circle class="mk-a" id="mkArc" cx="12" cy="12" r="9" transform="rotate(-90 12 12)" stroke-dasharray="56.55" stroke-dashoffset="56.55"/><circle class="mk-h" cx="12" cy="12" r="2.5"/></svg>Gym</h1>
  <div class="hdr-r"><div class="meta" id="weekBadge"></div><button class="icon" id="setBtn" aria-label="Дані й резервна копія"><span data-ic="database"></span></button></div>
</header>
<main id="view"></main>
<div class="timer" id="timer" hidden>
  <i id="timerBar"></i><span class="t" id="timerT">0:00</span>
  <button class="sm" data-timer="60">1:00</button>
  <button class="sm" data-timer="90">1:30</button>
  <button class="sm" data-timer="120">2:00</button>
  <button class="sm" data-timer="180">3:00</button>
  <button class="sm icon" data-timer="0" aria-label="Скинути таймер"><span data-ic="x"></span></button>
</div>
<nav id="nav">
  <button data-tab="workout"><span data-ic="dumbbell"></span>Тренування</button>
  <button data-tab="supps"><span data-ic="pill"></span>Добавки</button>
  <button data-tab="history"><span data-ic="list"></span>Історія</button>
  <button data-tab="progress"><span data-ic="trending-up"></span>Прогрес</button>
  <button data-tab="body"><span data-ic="scale"></span>Тіло</button>
</nav>
<div id="toast"></div>

<script>
'use strict';
/* ====== Сховище: усі ключі з унікальним префіксом ====== */
const KEY = 'gym-tracker:v1';
const DKEY = 'gym-tracker:draft';
const MAX_W = 30, STEP = 1.25;

/* ====== Програма ====== */
function E(slot, id, name, sets, lo, hi, o = {}) {
  return { slot, id, name, sets, lo, hi, side: !!o.side, iso: !!o.iso, bw: !!o.bw, rest: o.rest || '', note: o.note || '' };
}
const PROGRAM = {
  A: [
    E('A1','bss','Болгарські присідання',3,8,12,{side:1,rest:'2 хв',note:'Задня нога на лавці, корпус трохи вперед'}),
    E('A2','bench','Жим гантелей лежачи',3,6,10,{rest:'2–3 хв',note:'Лопатки зведені, гантелі до рівня грудей'}),
    E('A3','row1','Тяга гантелі однією рукою',3,8,12,{side:1,rest:'90 с',note:'Лікоть до стегна, пауза 1 с вгорі'}),
    E('A4','rdl','Румунська тяга',3,10,15,{rest:'2 хв',note:'Темп 3-0-1, розтягнення задньої поверхні'}),
    E('A5','lat','Махи гантелями в сторони',3,12,20,{iso:1,rest:'60 с',note:'Останній підхід — до відмови'}),
    E('A6','curl','Згинання на біцепс',2,10,15,{iso:1,rest:'60 с',note:'Без розгойдування'}),
    E('A7','calf','Підйом на носок на одній нозі',2,12,20,{side:1,iso:1,rest:'60 с',note:'Пауза 1 с внизу'})
  ],
  B: [
    E('B1','goblet','Гоблет-присідання (п’яти на підставці)',3,12,20,{rest:'2 хв',note:'Глибоко, темп 3-1-1'}),
    E('B2','incline','Жим гантелей на похилій лавці',3,8,12,{rest:'2 хв',note:'Або жим нейтральним хватом, якщо лавка пласка'}),
    E('B3','csrow','Тяга гантелей груддю на лавці',3,10,15,{rest:'90 с',note:'Або тяга в нахилі з упором чола'}),
    E('B4','hipthrust','Хіп-траст з гантеллю',3,10,15,{rest:'90 с',note:'Пауза 2 с вгорі; потім на одній нозі'}),
    E('B5','ohp','Жим гантелей сидячи над головою',3,8,12,{rest:'2 хв',note:'Без прогину в попереку'}),
    E('B6','ohtri','Французький жим з-за голови',2,10,15,{iso:1,rest:'60 с',note:'Акцент на розтягування'}),
    E('B7','deadbug','Dead bug',2,8,10,{side:1,iso:1,bw:1,rest:'60 с',note:'Поперек притиснутий до підлоги'})
  ],
  C: [
    E('C1','revlunge','Зворотні випади',3,10,15,{side:1,rest:'2 хв',note:'Переднє коліно над стопою'}),
    E('C2','slrdl','Румунська тяга на одній нозі',3,8,12,{side:1,rest:'90 с',note:'Можна триматися за стіну'}),
    E('C3','bench','Жим гантелей лежачи (більше повторень)',3,10,15,{rest:'2 хв',note:'Темп 3-0-1'}),
    E('C4','row1','Тяга гантелі однією рукою',3,10,15,{side:1,rest:'90 с',note:'Повна амплітуда'}),
    E('C5','reardelt','Розведення в нахилі (задня дельта)',2,12,20,{iso:1,rest:'60 с',note:'Легка вага, без ривків'}),
    E('C6','hammer','Молоткові згинання',2,10,15,{iso:1,rest:'суперсет',note:'Суперсет із наступною вправою'}),
    E('C7','skull','Розгинання лежачи (skullcrusher)',2,10,15,{iso:1,rest:'60–90 с',note:'Після пари — відпочинок'}),
    E('C8','slider','Згинання ніг на рушнику/слайдерах',2,8,15,{iso:1,bw:1,rest:'60 с',note:'Таз піднятий'})
  ]
};
const ALL_EX = (() => { const m = new Map(); for (const d of 'ABC') for (const e of PROGRAM[d]) if (!m.has(e.id)) m.set(e.id, e); return m; })();

function phase(week) {
  if (week <= 2) return { name: 'Повернення', rir: '3', isoRir: '3', sets: () => 2, tip: 'Техніка й адаптація, без важких ваг' };
  if (week <= 8) return { name: 'Основна', rir: '1–2', isoRir: '0–1', sets: e => e.sets, tip: 'Щотижня додавай повтори, потім +1,25 кг' };
  if (week === 9) return { name: 'Розвантаження', rir: '3–4', isoRir: '3–4', sets: () => 2, tip: 'Та сама вага, менше підходів' };
  if (week <= 12) return { name: 'Інтенсифікація', rir: '0–2', isoRir: '0–1', sets: (e, i) => e.sets + (i < 2 ? 1 : 0), tip: '+1 підхід до перших двох вправ' };
  return { name: 'Програму завершено', rir: '3–4', isoRir: '3–4', sets: () => 2, tip: 'Тиждень розвантаження, потім нова програма' };
}

/* ====== Іконки (lucide) ====== */
const ICONS = {"pill": "<path d=\"m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z\"/> <path d=\"m8.5 8.5 7 7\"/>", "chevron-left": "<path d=\"m15 18-6-6 6-6\"/>", "chevron-right": "<path d=\"m9 18 6-6-6-6\"/>", "calendar": "<path d=\"M8 2v3\"/> <path d=\"M16 2v3\"/> <rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/> <path d=\"M3 9h18\"/>", "check": "<path d=\"M20 6 9 17l-5-5\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"10\"/> <path d=\"M12 6v6l4 2\"/>", "database": "<ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"/> <path d=\"M3 5V19A9 3 0 0 0 21 19V5\"/> <path d=\"M3 12A9 3 0 0 0 21 12\"/>", "download": "<path d=\"M12 15V3\"/> <path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/> <path d=\"m7 10 5 5 5-5\"/>", "dumbbell": "<path d=\"M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z\"/> <path d=\"m2.5 21.5 1.4-1.4\"/> <path d=\"m20.1 3.9 1.4-1.4\"/> <path d=\"M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z\"/> <path d=\"m9.6 14.4 4.8-4.8\"/>", "hard-drive-download": "<path d=\"M12 2v8\"/> <path d=\"m16 6-4 4-4-4\"/> <rect width=\"20\" height=\"8\" x=\"2\" y=\"14\" rx=\"2\"/> <path d=\"M6 18h.01\"/> <path d=\"M10 18h.01\"/>", "list": "<path d=\"M3 5h.01\"/> <path d=\"M3 12h.01\"/> <path d=\"M3 19h.01\"/> <path d=\"M8 5h13\"/> <path d=\"M8 12h13\"/> <path d=\"M8 19h13\"/>", "minus": "<path d=\"M5 12h14\"/>", "notebook-pen": "<path d=\"M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4\"/> <path d=\"M2 6h4\"/> <path d=\"M2 10h4\"/> <path d=\"M2 14h4\"/> <path d=\"M2 18h4\"/> <path d=\"M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z\"/>", "pencil": "<path d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z\"/> <path d=\"m15 5 4 4\"/>", "plus": "<path d=\"M5 12h14\"/> <path d=\"M12 5v14\"/>", "scale": "<path d=\"M12 3v18\"/> <path d=\"m19 8 3 8a5 5 0 0 1-6 0zV7\"/> <path d=\"M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1\"/> <path d=\"m5 8 3 8a5 5 0 0 1-6 0zV7\"/> <path d=\"M7 21h10\"/>", "share": "<path d=\"M12 2v13\"/> <path d=\"m16 6-4-4-4 4\"/> <path d=\"M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8\"/>", "timer": "<line x1=\"10\" x2=\"14\" y1=\"2\" y2=\"2\"/> <line x1=\"12\" x2=\"15\" y1=\"14\" y2=\"11\"/> <circle cx=\"12\" cy=\"14\" r=\"8\"/>", "trash": "<path d=\"M10 11v6\"/> <path d=\"M14 11v6\"/> <path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6\"/> <path d=\"M3 6h18\"/> <path d=\"M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/>", "trending-up": "<path d=\"M16 7h6v6\"/> <path d=\"m22 7-8.5 8.5-5-5L2 17\"/>", "upload": "<path d=\"M12 3v12\"/> <path d=\"m17 8-5-5-5 5\"/> <path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/>", "x": "<path d=\"M18 6 6 18\"/> <path d=\"m6 6 12 12\"/>"};
const ic = n => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;
document.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });

/* ====== Утиліти ====== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
const pd = s => new Date(s + 'T00:00:00');
const dfmt = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}.${m}.${y}`; };
const ddmm = dfmt, ddmmyy = dfmt;
// Розбір дд.мм.рррр → yyyy-mm-dd (або null)
function parseDMY(str) {
  const m = String(str || '').trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/); if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3]; const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
// Поле дати дд.мм.рррр + кнопка календаря: прозоре нативне поле лежить поверх кнопки, тож тап відкриває системний вибір дати (iOS, Android, ПК)
const dateField = (id, iso) => `<div class="datef"><input id="${id}" class="dtext" inputmode="numeric" maxlength="10" placeholder="дд.мм.рррр" value="${dfmt(iso)}" autocomplete="off"><label class="pickbtn" title="Календар">${ic('calendar')}<input type="date" class="dpick" data-for="${id}" value="${iso || ''}" aria-label="Вибрати дату в календарі"></label></div>`;
const isoOf = id => parseDMY($('#' + id).value);
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const addDays = (s, k) => { const d = pd(s); d.setDate(d.getDate() + k); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmt = n => (Math.round(n * 100) / 100).toString().replace('.', ',');
const fmtInt = n => Math.round(n).toLocaleString('uk-UA');
const r1 = n => Math.round(n * 10) / 10;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function mondayOf(s) { const d = pd(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }

/* ====== Стан ====== */
function fresh() { return { version: 1, settings: { startDate: today(), lastExport: null }, workouts: [], body: [], supps: {}, suppCfg: { ashwaStart: null, ashwaBreak: null } }; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.version === 1 && Array.isArray(s.workouts)) return s; } catch (e) {}
  return null;
}
let S = load();
const firstRun = !S;
if (!S) S = fresh();
if (!S.supps || typeof S.supps !== 'object') S.supps = {};
if (!S.suppCfg) S.suppCfg = { ashwaStart: null, ashwaBreak: null };
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch (e) { alert('Не вдалося зберегти дані: ' + e.message); return false; }
}
if (firstRun) save();

let D = null;
try { D = JSON.parse(localStorage.getItem(DKEY)); } catch (e) { D = null; }
function saveDraft() { try { localStorage.setItem(DKEY, JSON.stringify(D)); } catch (e) {} }
function clearDraft() { D = null; try { localStorage.removeItem(DKEY); } catch (e) {} }
// Нове тренування завжди отримує сьогоднішню дату: порожня стара чернетка скидається, у заповненій міняється лише дата
function freshenDraft() {
  if (!D || D.editId || D.date === today()) return;
  if (!hasData(D)) clearDraft(); else { D.date = today(); saveDraft(); }
}

function weekOf(date) { return Math.max(1, Math.floor(daysBetween(S.settings.startDate, date) / 7) + 1); }
function sortedWorkouts() { return [...S.workouts].sort((a, b) => a.date === b.date ? a.savedAt - b.savedAt : a.date < b.date ? -1 : 1); }
function nextDay() {
  const w = sortedWorkouts(); if (!w.length) return 'A';
  return { A: 'B', B: 'C', C: 'A' }[w[w.length - 1].day] || 'A';
}
function lastFor(slot, excludeId) {
  const w = sortedWorkouts();
  for (let i = w.length - 1; i >= 0; i--) {
    if (w[i].id === excludeId) continue;
    const ex = w[i].ex.find(x => x.slot === slot);
    if (ex && ex.sets.length) return { date: w[i].date, sets: ex.sets };
  }
  return null;
}
function suggest(e, last) {
  if (!last) return { w: '', text: '' };
  if (e.bw) {
    const top = last.sets.every(s => s.r >= e.hi);
    return { w: '', text: top ? 'Усі підходи на верхній межі, ускладни темп або додай паузу' : 'Ціль: +1 повтор' };
  }
  const w = Math.max(...last.sets.map(s => s.w || 0));
  const allTop = last.sets.every(s => s.r >= e.hi && (s.w || 0) >= w);
  if (allTop) {
    if (w + STEP <= MAX_W) return { w: w + STEP, text: `Усі підходи на ${e.hi}, бери ${fmt(w + STEP)} кг`, up: true };
    return { w, text: '30 кг — максимум, прогресуй темпом 3–4 с вниз, паузами й повторами до 20–30', up: true };
  }
  return { w, text: 'Та сама вага, ціль +1–2 повтори' };
}
const hasData = d => d && Object.values(d.ex || {}).some(arr => arr.some(s => String(s.r).trim() !== ''));

function newDraft(day, date) {
  date = date || today();
  const ph = phase(weekOf(date));
  D = { day, date, note: '', editId: null, ex: {} };
  PROGRAM[day].forEach((e, i) => {
    const sg = suggest(e, lastFor(e.slot));
    const w = e.bw || sg.w === '' ? '' : fmt(sg.w);
    D.ex[e.slot] = Array.from({ length: ph.sets(e, i) }, () => ({ w, r: '', rir: '' }));
  });
  saveDraft();
}

/* ====== Навігація ====== */
let tab = 'workout';
let justSaved = null, sumShown = null;
function go(t) {
  if (t !== 'history') justSaved = null;
  tab = t; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); $('#setBtn').classList.toggle('on', t === 'settings'); render(); window.scrollTo(0, 0);
  const v = $('#view'); v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  clearTimeout(go._t); go._t = setTimeout(() => v.classList.remove('enter'), 500);
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
$('#setBtn').addEventListener('click', () => go('settings'));

function render() {
  const showTimer = tab === 'workout';
  $('#timer').hidden = !showTimer;
  document.body.classList.toggle('has-timer', showTimer);
  ({ workout: rWorkout, supps: rSupps, history: rHistory, progress: rProgress, body: rBody, settings: rSettings })[tab]();
  const wk = weekOf(tab === 'workout' && D ? D.date : today());
  $('#weekBadge').textContent = wk <= 12 ? `Тиждень ${wk} з 12 · ${phase(wk).name}` : phase(wk).name;
  updateSess();
}

/* ====== Банер резервної копії ====== */
function backupBanner() {
  if (!S.workouts.length) return '';
  const le = S.settings.lastExport;
  const age = le ? daysBetween(le, today()) : null;
  if (age !== null && age < 7) return '';
  return `<div class="banner">${ic('hard-drive-download')}<div><div>${le ? `Остання копія ${age} дн. тому` : 'Резервної копії ще немає'}</div><div class="sub">Дані зберігаються лише в цьому браузері</div></div><button class="sm" data-act="export">Зберегти</button></div>`;
}

/* ====== Тренування ====== */
const PL_C = 2 * Math.PI * 54.5, MK_C = 2 * Math.PI * 9;
// Диск: гумове кільце «розжарюється» за годинниковою стрілкою, коли записуєш підходи
function plate(w, frac, bare) {
  return `<svg class="plate" viewBox="0 0 132 132" aria-hidden="true"><defs>
    <radialGradient id="plRub" gradientUnits="userSpaceOnUse" cx="48" cy="40" r="104" gradientTransform="rotate(90 66 66)"><stop offset="0" stop-color="#f7a865"/><stop offset=".5" stop-color="#e5832f"/><stop offset="1" stop-color="#9c4d17"/></radialGradient>
    <radialGradient id="plCold" cx="38%" cy="32%" r="78%"><stop offset="0" stop-color="#6e4526"/><stop offset="1" stop-color="#3d2716"/></radialGradient>
    <radialGradient id="plIron" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#404044"/><stop offset="1" stop-color="#1b1b1d"/></radialGradient></defs>
    <circle cx="66" cy="66" r="62" fill="url(#plCold)"/>
    <circle id="plArc" cx="66" cy="66" r="54.5" fill="none" stroke="url(#plRub)" stroke-width="15" stroke-dasharray="${PL_C.toFixed(2)}" stroke-dashoffset="${(PL_C * (1 - frac)).toFixed(2)}" transform="rotate(-90 66 66)"/>
    <circle cx="66" cy="66" r="61.5" fill="none" stroke="#000" stroke-opacity=".3"/>
    <circle cx="66" cy="66" r="56" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="1.5"/>
    <circle cx="66" cy="66" r="47" fill="url(#plIron)"/>

/* ====== Історія ====== */
// Цілі для загального тоннажу (маса приблизна) і мірки для одного тренування

const REFS = [
  { n: 'концертний рояль', kg: 480 },
  { n: '«Запорожець» ЗАЗ-968М', kg: 840 },

const tons = kg => kg >= 1000 ? fmt(r1(kg / 1000)) + ' т' : fmtInt(kg) + ' кг';

  else if (state === 'cur') { const r = c - 2, L = 2 * Math.PI * r;
    body = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:var(--line2)" stroke-width="3"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:var(--acc)" stroke-width="3" stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="${(L * (1 - frac)).toFixed(1)}" transform="rotate(-90 ${c} ${c})"/><circle cx="${c}" cy="${c}" r="${hub}" style="fill:var(--acc)"/>`; }
  else body = `<circle cx="${c}" cy="${c}" r="${c - 0.5}" fill="none" style="stroke:var(--line2)"/><circle cx="${c}" cy="${c}" r="${hub}" style="fill:var(--line2)"/>`;

function emptyState(title, sub) {

}
// Усього піднято: шість дисків-цілей, від рояля до «Мрії»
function ladderCard(total, n) {

    <div class="stat"><span class="fig">${total >= 1000 ? fmt(r1(total / 1000)) : fmtInt(total)}</span><span class="unit">${total >= 1000 ? 'т' : 'кг'}</span></div>
    <div class="chg">${n} ${pl(n, ['тренування', 'тренування', 'тренувань'])} · ${next ? `до цілі «${next.n.replace(/[«»]/g, '')}» ${tons(next.kg - total)}` : 'усі цілі взято'}</div>
    <div class="lad">${MILES.map((m, i) => { const st = ni < 0 || i < ni ? 'done' : i === ni ? 'cur' : 'todo';
      return `<div class="${st}" title="${esc(m.n)}">${disc(20 + i * 4, st, total / m.kg)}<span>${m.s}</span><small>${tons(m.kg)}</small></div>`; }).join('')}</div></div>`;

function prCount(w) {

  let n = 0;
  for (const e of w.ex) { const cur = Math.max(0, ...e.sets.map(e1rm)); const prev = bestE1(e.id, earlier); if (prev > 0 && cur > prev + 0.05) n++; }
  return n;
}

    ${ref ? `<div class="sub">≈ ${fmt(r1(vol / ref.kg))} × ${esc(ref.n)}, ${tons(ref.kg)}</div>` : ''}

function countUp(el, to) {

/* ====== Графік ====== */
let chartN = 0;
function prIdx(pts) { const set = new Set(); let mx = -Infinity; pts.forEach((p, i) => { if (i > 0 && p.y > mx) set.add(i); mx = Math.max(mx, p.y); }); return set; }
function chart(pts, unit, markPR) {
  if (pts.length < 2) return '<div class="sub mt12">Для графіка потрібно щонайменше 2 записи</div>';
  const W = 340, H = 180, pl = 36, pr = 8, pt = 8, pb = 24;
  const ys = pts.map(p => p.y); let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mn === mx) { mn -= 1; mx += 1; }
  const pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
  const t0 = pd(pts[0].x).getTime(), t1 = pd(pts[pts.length - 1].x).getTime();
  const X = x => pl + (t1 === t0 ? 0.5 : (pd(x).getTime() - t0) / (t1 - t0)) * (W - pl - pr);
  const Y = y => pt + (1 - (y - mn) / (mx - mn)) * (H - pt - pb);
  const xy = pts.map(p => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`);
  const base = (H - pb).toFixed(1);
  const area = `M${X(pts[0].x).toFixed(1)},${base} L${xy.join(' L')} L${X(pts[pts.length - 1].x).toFixed(1)},${base} Z`;
  const T = 'style="font-family:var(--mono);fill:var(--muted)" font-size="10"';
  const grid = [0, 0.5, 1].map(f => { const v = mn + (mx - mn) * f; const y = Y(v).toFixed(1);
    return `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${pl - 6}" y="${+y + 3}" ${T} text-anchor="end">${fmt(r1(v))}</text>`; }).join('');
  const lp = pts[pts.length - 1], gid = 'ag' + (++chartN), prs = markPR ? prIdx(pts) : new Set();
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Графік"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0913a" stop-opacity=".24"/><stop offset="1" stop-color="#f0913a" stop-opacity="0"/></linearGradient></defs>${grid}
    <path d="${area}" fill="url(#${gid})"/>
    <polyline points="${xy.join(' ')}" fill="none" style="stroke:var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.slice(0, -1).map((p, i) => prs.has(i) ? `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" style="fill:var(--card);stroke:var(--acc)" stroke-width="1.5"><title>Рекорд · ${dfmt(p.x)}: ${fmt(p.y)} ${unit}</title></circle>` : `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2" style="fill:var(--acc)" opacity=".55"><title>${dfmt(p.x)}: ${fmt(p.y)} ${unit}</title></circle>`).join('')}
    <circle cx="${X(lp.x).toFixed(1)}" cy="${Y(lp.y).toFixed(1)}" r="4" style="fill:var(--acc);stroke:var(--card)" stroke-width="2"><title>${dfmt(lp.x)}: ${fmt(lp.y)} ${unit}</title></circle>
    <text x="${pl}" y="${H - 6}" ${T}>${dfmt(pts[0].x)}</text>
    <text x="${W - pr}" y="${H - 6}" ${T} text-anchor="end">${dfmt(lp.x)}</text></svg>`;
}
function statBlock(label, pts, unit, goodUp) {
  if (!pts.length) return '';
  const lp = pts[pts.length - 1], d = pts.length > 1 ? r1(lp.y - pts[0].y) : null;
  const cls = d == null || d === 0 ? '' : (d > 0) === goodUp ? 'pos' : 'neg';
  return `<div class="stat-l">${label}</div><div class="stat"><span class="fig">${fmt(lp.y)}</span><span class="unit">${unit}</span></div>
    ${d != null ? `<div class="chg"><span class="${cls}">${d > 0 ? '+' : ''}${fmt(d)} ${unit}</span> від ${dfmt(pts[0].x)}</div>` : ''}`;

/* ====== Прогрес ====== */
let progSel = null;
const e1rm = s => (s.w || 0) * (1 + (s.r + (s.rir || 0)) / 30);
function rProgress() {
  const ids = [...ALL_EX.keys()].filter(id => S.workouts.some(w => w.ex.some(e => e.id === id)));
  if (!ids.length) { $('#view').innerHTML = emptyState('Графіків ще немає', 'Збережи кілька тренувань, і тут з’явиться крива сили'); return; }
  if (!progSel || !ids.includes(progSel)) progSel = ids[0];
  const exDef = ALL_EX.get(progSel);
  const rows = [];
  for (const w of sortedWorkouts()) for (const e of w.ex) if (e.id === progSel) {
    const best = e.sets.reduce((a, s) => (e1rm(s) > e1rm(a) || (!s.w && s.r > a.r)) ? s : a, e.sets[0]);
    rows.push({ date: w.date, day: w.day, best, e1: e1rm(best), vol: e.sets.reduce((a, s) => a + (s.w || 0) * s.r, 0), reps: e.sets.reduce((a, s) => a + s.r, 0) });
  }
  const bw = exDef.bw || rows.every(r => !r.best.w);
  const pts = rows.map(r => ({ x: r.date, y: bw ? r.reps : r1(r.e1) }));
  const unit = bw ? 'повт.' : 'кг';
  const prs = prIdx(pts), prCount = prs.size;
  rows.forEach((r, i) => { r.pr = prs.has(i); });
  $('#view').innerHTML = `<div class="card"><label for="pSel">Вправа</label><select id="pSel">${ids.map(id => `<option value="${id}" ${id === progSel ? 'selected' : ''}>${esc(ALL_EX.get(id).name.replace(/ \(.*\)$/, ''))}</option>`).join('')}</select></div>
    <div class="card">${statBlock(bw ? 'Повторів за тренування' : 'Розрахунковий 1ПМ, одна гантель', pts, unit, true)}${prCount ? `<div class="chg">Рекордів: ${prCount}</div>` : ''}${chart(pts, unit, true)}
    ${bw ? '' : '<div class="sub">Формула Еплі з поправкою на RIR, тож видно силу навіть при різній кількості повторів</div>'}</div>
    <div class="card"><table class="nw"><tr><th>Дата</th><th>Найкращий</th><th class="num">${bw ? 'Повт.' : '1ПМ'}</th><th class="num">Тоннаж</th></tr>
    ${rows.slice().reverse().map(r => `<tr><td class="d">${dfmt(r.date)} <span class="muted">${r.day}</span></td><td class="d">${r.best.w ? fmt(r.best.w) + '×' : ''}${r.best.r}${r.best.rir != null ? '<span class="muted">@' + r.best.rir + '</span>' : ''}</td><td class="num">${r.pr ? '<span class="pr">PR</span> ' : ''}${bw ? r.reps : fmt(r1(r.e1))}</td><td class="num">${fmtInt(r.vol)}</td></tr>`).join('')}</table></div>`;
}

/* ====== Тіло ====== */
function rBody() {
  const b = [...S.body].sort((x, y) => x.date < y.date ? -1 : 1);
  const t = b.find(x => x.date === today());
  let h = `<div class="card"><h3>Новий запис</h3><div class="sub">Вага щоранку натщесерце, талія раз на тиждень на рівні пупка</div>
    <div class="mt12"><label>Дата</label>${dateField('bDate', today())}</div>
    <div class="grid2 mt12"><div><label for="bW">Вага, кг</label><input id="bW" inputmode="decimal" class="mono" value="${t && t.weight != null ? fmt(t.weight) : ''}" placeholder="90,0"></div>
    <div><label for="bT">Талія, см</label><input id="bT" inputmode="decimal" class="mono" value="${t && t.waist != null ? fmt(t.waist) : ''}" placeholder="—"></div></div>
    <button class="pri wide mt12" style="margin-bottom:0" data-act="saveBody">Зберегти</button></div>`;
  if (b.length) {
    const weeks = new Map();
    for (const x of b) { const k = mondayOf(x.date); if (!weeks.has(k)) weeks.set(k, { w: [], waist: null }); const g = weeks.get(k); if (x.weight != null) g.w.push(x.weight); if (x.waist != null) g.waist = x.waist; }
    const wk = [...weeks.entries()].map(([k, g]) => ({ k, avg: g.w.length ? g.w.reduce((a, c) => a + c, 0) / g.w.length : null, n: g.w.length, waist: g.waist }));
    const wpts = wk.filter(x => x.avg != null).map(x => ({ x: x.k, y: r1(x.avg) }));
    const tpts = wk.filter(x => x.waist != null).map(x => ({ x: x.k, y: x.waist }));
    if (wpts.length) h += `<div class="card">${statBlock('Середня вага за тиждень', wpts, 'кг', false)}${chart(wpts, 'кг')}</div>`;
    if (tpts.length) h += `<div class="card">${statBlock('Талія', tpts, 'см', false)}${chart(tpts, 'см')}</div>`;
    h += `<div class="card"><table><tr><th>Тиждень з</th><th class="num">Сер. вага</th><th class="num">Зміна</th><th class="num">Талія</th></tr>
      ${wk.map((x, i) => { const p = i ? wk[i - 1].avg : null; const d = x.avg != null && p != null ? r1(x.avg - p) : null;
        return `<tr><td class="d">${dfmt(x.k)} <span class="muted">${x.n}×</span></td><td class="num">${x.avg != null ? fmt(r1(x.avg)) : '—'}</td>
        <td class="num ${d == null || d === 0 ? '' : d < 0 ? 'pos' : 'neg'}">${d == null ? '' : (d > 0 ? '+' : '') + fmt(d)}</td><td class="num">${x.waist != null ? fmt(x.waist) : '—'}</td></tr>`; }).reverse().join('')}</table>
      <div class="sub mt12">Ціль: −0,25…0,5% ваги на тиждень, це ≈0,2–0,45 кг. Якщо вага стоїть, а талія зменшується й сила росте, рекомпозиція теж іде</div></div>`;
    h += `<details class="card"><summary>Усі записи (${b.length})</summary><table class="mt12">${b.slice().reverse().map(x => `<tr><td class="d">${dfmt(x.date)}</td><td class="num">${x.weight != null ? fmt(x.weight) + ' кг' : ''}</td><td class="num">${x.waist != null ? fmt(x.waist) + ' см' : ''}</td><td class="num"><button class="icon del" data-act="delBody" data-date="${x.date}" aria-label="Видалити запис">${ic('trash')}</button></td></tr>`).join('')}</table></details>`;
  }
  $('#view').innerHTML = h;
}
function saveBody() {
  const date = isoOf('bDate') || today(), w = num($('#bW').value), t = num($('#bT').value);
  if (w == null && t == null) { toast('Введи вагу або талію'); return; }
  const ex = S.body.find(x => x.date === date);
  if (ex) { if (w != null) ex.weight = w; if (t != null) ex.waist = t; }
  else S.body.push({ date, weight: w, waist: t });
  save(); requestPersist(false); toast('Збережено'); render();
}

/* ====== Дані / налаштування ====== */
function rSettings() {
  const size = ((localStorage.getItem(KEY) || '').length * 2 / 1024).toFixed(1).replace('.', ',');
  const le = S.settings.lastExport;
  $('#view').innerHTML = backupBanner() + `<div class="card"><h3>Старт програми</h3><div class="sub">Від цієї дати рахуються тижні й фази: повернення, основна, розвантаження, інтенсифікація</div>
    <div class="row mt12" style="flex-wrap:nowrap"><div style="flex:1">${dateField('startDate', S.settings.startDate)}</div><button data-act="saveStart" style="min-height:44px">Зберегти</button></div></div>
    <div class="card"><h3>Резервна копія</h3>
      <div class="meta" style="margin-top:4px">Остання: ${le ? dfmt(le) : 'ще не було'} · тренувань ${S.workouts.length} · записів тіла ${S.body.length} · днів добавок ${Object.keys(S.supps).length} · ≈${size} КБ</div>
      <div class="btn-row"><button class="pri" data-act="export">${ic('download')}Експорт JSON</button>
      ${navigator.canShare ? `<button data-act="share">${ic('share')}Поділитися</button>` : ''}
      <button data-act="import">${ic('upload')}Імпорт</button></div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <div class="sub mt12">Зберігай копію раз на тиждень у Google Drive або Telegram «Збережене»</div></div>
    <div class="card"><h3>Надійність сховища</h3><div class="sub" id="persistInfo">Перевіряю…</div>
      <button class="sm mt12" data-act="persist">Попросити постійне сховище</button>
      <div class="tips"><div><b>iPhone</b>Safari може стерти дані сайту, якщо не відкривати його 7 днів. Додай сайт на головний екран і відкривай звідти</div>
      <div><b>Android</b>Не роби «Очистити сховище» для Chrome. Звичайне очищення кешу дані не чіпає</div>
      <div><b>Інкогніто</b>Нічого не зберігає, а дані живуть лише в цьому браузері на цьому пристрої</div></div></div>
    <div class="card"><h3>Видалення даних</h3><div class="sub">Усі тренування й записи тіла, без можливості відновлення</div><button class="danger mt12" data-act="wipe">${ic('trash')}Видалити всі дані</button></div>`;
  const pi = $('#persistInfo');
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { pi.innerHTML = p ? '<span class="pos">Постійне сховище увімкнено</span>, браузер не видалить дані автоматично' : 'Сховище звичайне: при нестачі місця браузер теоретично може його очистити'; });
  else pi.textContent = 'Браузер не підтримує запит постійного сховища';
}
function requestPersist(manual) {
  if (!(navigator.storage && navigator.storage.persist)) { if (manual) toast('Браузер не підтримує цю функцію'); return; }
  navigator.storage.persist().then(ok => { if (manual) { toast(ok ? 'Постійне сховище увімкнено' : 'Браузер відхилив запит, спробуй додати сайт на головний екран'); render(); } });
}
function exportJSON() { return JSON.stringify({ ...S, exportedAt: new Date().toISOString() }, null, 1); }
function exportName() { return `gym-tracker-${today()}.json`; }
function markExported() { S.settings.lastExport = today(); save(); render(); }
function exportData() {
  const blob = new Blob([exportJSON()], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = exportName();
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  markExported(); toast('Файл копії збережено');
}
async function shareData() {
  try {
    const f = new File([exportJSON()], exportName(), { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Gym backup' }); markExported(); }
    else exportData();
  } catch (e) { if (e.name !== 'AbortError') toast('Не вдалося поділитися: ' + e.message); }
}
function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || d.version !== 1 || !Array.isArray(d.workouts) || !Array.isArray(d.body)) throw new Error('Невідомий формат файлу');
      if (!confirm(`У файлі: ${d.workouts.length} тренувань, ${d.body.length} записів тіла.\nЗамінити поточні дані (${S.workouts.length} тренувань)?`)) return;
      S = { version: 1, settings: { startDate: d.settings?.startDate || S.settings.startDate, lastExport: d.settings?.lastExport || null }, workouts: d.workouts, body: d.body,
        supps: d.supps && typeof d.supps === 'object' ? d.supps : {}, suppCfg: d.suppCfg || { ashwaStart: null, ashwaBreak: null } };
      save(); toast('Дані відновлено'); render();
    } catch (e) { alert('Помилка імпорту: ' + e.message); }
  };
  r.readAsText(file);
}
function wipe() {
  if (!confirm('Видалити ВСІ тренування й записи? Це незворотно.')) return;
  if (prompt('Щоб підтвердити, введи слово ВИДАЛИТИ') !== 'ВИДАЛИТИ') return;
  S = fresh(); save(); clearDraft(); toast('Дані видалено'); render();
}

/* ====== Таймер відпочинку ====== */
let tEnd = 0, tInt = null, tTotal = 1;
function tick() {
  const el = $('#timerT'); const left = Math.ceil((tEnd - Date.now()) / 1000);
  $('#timerBar').style.width = Math.max(0, (tEnd - Date.now()) / (tTotal * 1000) * 100) + '%';
  if (left <= 0) {
    clearInterval(tInt); tInt = null; el.textContent = 'Готово'; el.className = 't end';
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(); o.frequency.value = 880; o.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.35); } catch (e) {}
    return;
  }
  el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); el.className = 't run';
}
$('#timer').addEventListener('click', e => {
  const b = e.target.closest('[data-timer]'); if (!b) return;
  const s = +b.dataset.timer; clearInterval(tInt); tInt = null;
  if (!s) { $('#timerT').textContent = '0:00'; $('#timerT').className = 't'; $('#timerBar').style.width = '0'; return; }
  tTotal = s; tEnd = Date.now() + s * 1000; tick(); tInt = setInterval(tick, 250);
});

/* ====== Старт ====== */
window.addEventListener('storage', ev => { if (ev.key === KEY) { S = load() || S; if (!S.supps) S.supps = {}; if (!S.suppCfg) S.suppCfg = { ashwaStart: null, ashwaBreak: null }; render(); } });
// Якщо застосунок відкрили наступного дня (або він висів у фоні після півночі), дати оновлюються на сьогодні
let dayStamp = today();
function onWake() {
  if (dayStamp === today()) return;
  const old = dayStamp; dayStamp = today();
  freshenDraft(); if (suppDate === old) suppDate = dayStamp;
  render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) onWake(); });
window.addEventListener('pageshow', onWake);
window.addEventListener('focus', onWake);
freshenDraft();
go('workout');
</script>
</body>
</html>
